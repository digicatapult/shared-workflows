name: Build Docker
on:
  workflow_call:
    inputs:
      build_args:
        required: false
        type: string
        default: ""
      env_vars:
        required: false
        type: string
        default: "{}"
      pull_dhi:
        required: false
        type: boolean
        default: false
      push_dockerhub:
        required: false
        type: boolean
        default: false
      push_ghcr:
        required: false
        type: boolean
        default: false
      docker_platforms:
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      docker_file:
        required: false
        type: string
        default: Dockerfile
      package_manager:
        required: false
        type: string
        default: "npm"
        description: "Package manager for version detection (passed to check-version). Options: npm, poetry"
      arm64_runner:
        required: false
        type: string
        default: "ubuntu-24.04-arm"
        description: "Runner label used for native linux/arm64 builds. Must exist as a GitHub-hosted runner in the org before this is used - see ENG-309."
      scan_container:
        required: false
        type: boolean
        default: false
        description: "Scan the built linux/amd64 image for CVEs with Trivy and fail on scan_fail_severity. Runs in an isolated least-privilege job; results are uploaded as an artifact (no GHAS upload). See ENG-314."
      trivy_image:
        required: false
        type: string
        default: "aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f"
        description: "Trivy scanner image, pinned by digest (renovate-updatable). Deliberately not the aquasecurity/trivy-action, which was supply-chain compromised in March 2026 - see ENG-314."
      scan_fail_severity:
        required: false
        type: string
        default: "CRITICAL"
        description: "Comma-separated severities that fail the build (gate). The uploaded report always contains every severity."
      fail_on_same_version:
        required: false
        type: boolean
        default: true
        description: Fail when the version already matches the latest release. Merge queue repos set false.
      scan_ignore_unfixed:
        required: false
        type: boolean
        default: true
        description: "When gating, ignore vulnerabilities that have no fix available so the gate stays actionable. Does not affect the report, which always lists fixed and unfixed."
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
jobs:
  prepare:
    name: Prepare build
    runs-on: ubuntu-latest
    outputs:
      repo_name: ${{ steps.repo_ids.outputs.REPO_NAME }}
      org_name: ${{ steps.repo_ids.outputs.ORG_NAME }}
      version: ${{ steps.get_version.outputs.VERSION }}
      build_date: ${{ steps.get_version.outputs.BUILD_DATE }}
      image_names: ${{ steps.image-names.outputs.names }}
      ghcr_version_tag: ${{ steps.generate-tags.outputs.GHCR_VERSION_TAG }}
      ghcr_latest_tag: ${{ steps.generate-tags.outputs.GHCR_LATEST_TAG }}
      dockerhub_version_tag: ${{ steps.generate-tags.outputs.DOCKERHUB_VERSION_TAG }}
      dockerhub_latest_tag: ${{ steps.generate-tags.outputs.DOCKERHUB_LATEST_TAG }}
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set environment variables from JSON
        env:
          ENV_VARS_JSON: "${{ inputs.env_vars }}"
        run: |
          echo "Parsing JSON environment variables..."
          echo "$ENV_VARS_JSON" | jq -r 'to_entries|map("\(.key)=\(.value|tostring)")|.[]' >> $GITHUB_ENV
      - name: Get repository identifiers
        id: repo_ids
        run: |
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          ORG_NAME=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_NAME=$REPO_NAME" >> $GITHUB_OUTPUT
          echo "ORG_NAME=$ORG_NAME" >> $GITHUB_OUTPUT
      - id: get_version
        uses: digicatapult/check-version@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package_manager: ${{ inputs.package_manager }}
          fail_on_same_version: ${{ inputs.fail_on_same_version }}
      - name: Compute image names to push
        id: image-names
        run: |
          NAMES=""
          if [ "${{ inputs.push_ghcr }}" = "true" ]; then
            NAMES="ghcr.io/${{ steps.repo_ids.outputs.ORG_NAME }}/${{ steps.repo_ids.outputs.REPO_NAME }}"
          fi
          if [ "${{ inputs.push_dockerhub }}" = "true" ]; then
            NAMES="${NAMES:+$NAMES,}${{ steps.repo_ids.outputs.ORG_NAME }}/${{ steps.repo_ids.outputs.REPO_NAME }}"
          fi
          echo "names=$NAMES" >> $GITHUB_OUTPUT
      - name: Generate tags
        id: generate-tags
        if: ${{ inputs.push_dockerhub == true || inputs.push_ghcr == true }}
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          IS_NEW_VERSION: ${{ steps.get_version.outputs.IS_NEW_VERSION }}
          IS_PRERELEASE: ${{ steps.get_version.outputs.IS_PRERELEASE }}
        run: |
          echo "GHCR_VERSION_TAG=" >> $GITHUB_OUTPUT
          echo "DOCKERHUB_VERSION_TAG=" >> $GITHUB_OUTPUT
          echo "GHCR_LATEST_TAG=" >> $GITHUB_OUTPUT
          echo "DOCKERHUB_LATEST_TAG=" >> $GITHUB_OUTPUT
          if [ "$IS_NEW_VERSION" == "true" ]; then
            if [ "${{ inputs.push_ghcr }}" == "true" ]; then
              echo "GHCR_VERSION_TAG=ghcr.io/${{ steps.repo_ids.outputs.ORG_NAME }}/${{ steps.repo_ids.outputs.REPO_NAME }}:$VERSION" >> $GITHUB_OUTPUT
              if [ "$IS_PRERELEASE" == "false" ]; then
                echo "GHCR_LATEST_TAG=ghcr.io/${{ steps.repo_ids.outputs.ORG_NAME }}/${{ steps.repo_ids.outputs.REPO_NAME }}:latest" >> $GITHUB_OUTPUT
              fi
            fi
            if [ "${{ inputs.push_dockerhub }}" == "true" ]; then
              echo "DOCKERHUB_VERSION_TAG=${{ steps.repo_ids.outputs.ORG_NAME }}/${{ steps.repo_ids.outputs.REPO_NAME }}:$VERSION" >> $GITHUB_OUTPUT
              if [ "$IS_PRERELEASE" == "false" ]; then
                echo "DOCKERHUB_LATEST_TAG=${{ steps.repo_ids.outputs.ORG_NAME }}/${{ steps.repo_ids.outputs.REPO_NAME }}:latest" >> $GITHUB_OUTPUT
              fi
            fi
          fi
      - name: Build platform matrix
        id: build-matrix
        env:
          DOCKER_PLATFORMS: ${{ inputs.docker_platforms }}
          ARM64_RUNNER: ${{ inputs.arm64_runner }}
        run: |
          IFS=',' read -ra PLATS <<< "$DOCKER_PLATFORMS"
          ENTRIES=()
          for raw in "${PLATS[@]}"; do
            p=$(echo "$raw" | xargs)
            case "$p" in
              linux/amd64) runner="ubuntu-latest"; native=true ;;
              linux/arm64) runner="$ARM64_RUNNER"; native=true ;;
              *) runner="ubuntu-latest"; native=false ;;
            esac
            slug=$(echo "$p" | tr '/' '-')
            ENTRIES+=("{\"platform\":\"$p\",\"runner\":\"$runner\",\"native\":$native,\"slug\":\"$slug\"}")
          done
          MATRIX=$(IFS=,; echo "[${ENTRIES[*]}]")
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build:
    name: Build - ${{ matrix.platform }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Set environment variables from JSON
        env:
          ENV_VARS_JSON: "${{ inputs.env_vars }}"
        run: |
          echo "$ENV_VARS_JSON" | jq -r 'to_entries|map("\(.key)=\(.value|tostring)")|.[]' >> $GITHUB_ENV
      - name: Setup QEMU
        if: ${{ matrix.native == false }}
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all
      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-flags: "--debug"
      - name: Login to GitHub Container Registry
        if: ${{ inputs.push_ghcr == true }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Dockerhub Registry
        if: ${{ inputs.push_ghcr == true || inputs.push_dockerhub == true }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to DHI Registry
        if: ${{ inputs.pull_dhi == true }}
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        if: ${{ inputs.push_ghcr == true || inputs.push_dockerhub == true }}
        id: build
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ${{ inputs.docker_file }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ inputs.build_args }}
          sbom: true
          outputs: type=image,"name=${{ needs.prepare.outputs.image_names }}",push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=${{ needs.prepare.outputs.repo_name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.build_date }}
      - name: Export digest
        if: ${{ inputs.push_ghcr == true || inputs.push_dockerhub == true }}
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        if: ${{ inputs.push_ghcr == true || inputs.push_dockerhub == true }}
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Build only
        if: ${{ inputs.push_ghcr == false && inputs.push_dockerhub == false }}
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ${{ inputs.docker_file }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ inputs.build_args }}
          push: false

      # Export the linux/amd64 image as a tarball for the isolated scan-image
      # job. This reuses the buildx cache from the build above (a cache hit),
      # and reuses the registry logins already performed in this job for
      # private base images. The scan itself runs in a separate least-privilege
      # job so Trivy never sees this job's push credentials. See ENG-314.
      - name: Export amd64 image for scanning
        if: ${{ inputs.scan_container && matrix.platform == 'linux/amd64' }}
        env:
          DOCKERFILE: ${{ inputs.docker_file }}
          BUILD_ARGS: ${{ inputs.build_args }}
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r line; do
            [ -z "${line}" ] && continue
            args+=(--build-arg "${line}")
          done <<< "${BUILD_ARGS}"
          docker buildx build \
            --builder "${BUILDER}" \
            --platform linux/amd64 \
            --file "${DOCKERFILE}" \
            "${args[@]}" \
            --load \
            --tag scan-image:amd64 \
            .
          docker save scan-image:amd64 -o "${RUNNER_TEMP}/scan-image.tar"
      - name: Upload amd64 image for scanning
        if: ${{ inputs.scan_container && matrix.platform == 'linux/amd64' }}
        uses: actions/upload-artifact@v7
        with:
          name: scan-image
          path: ${{ runner.temp }}/scan-image.tar
          retention-days: 1
          if-no-files-found: error

  merge:
    name: Merge manifests & scan
    # Depends on scan-image so a CRITICAL container CVE blocks the consumable
    # tag from ever being published. scan-image is skipped when scan_container
    # is false, so releases without scanning still tag as before.
    needs: [prepare, build, scan-image]
    if: >-
      ${{ always()
          && (inputs.push_ghcr == true || inputs.push_dockerhub == true)
          && needs.prepare.result == 'success'
          && needs.build.result == 'success'
          && (needs.scan-image.result == 'success' || needs.scan-image.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Login to GitHub Container Registry
        if: ${{ inputs.push_ghcr == true }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Dockerhub Registry
        if: ${{ inputs.push_dockerhub == true }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create GHCR manifest list
        if: ${{ inputs.push_ghcr == true }}
        working-directory: /tmp/digests
        run: |
          IMAGE="ghcr.io/${{ needs.prepare.outputs.org_name }}/${{ needs.prepare.outputs.repo_name }}"
          TAGS="-t $IMAGE:${{ github.sha }}"
          [ -n "${{ needs.prepare.outputs.ghcr_version_tag }}" ] && TAGS="$TAGS -t ${{ needs.prepare.outputs.ghcr_version_tag }}"
          [ -n "${{ needs.prepare.outputs.ghcr_latest_tag }}" ] && TAGS="$TAGS -t ${{ needs.prepare.outputs.ghcr_latest_tag }}"
          docker buildx imagetools create $TAGS $(printf "$IMAGE@sha256:%s " *)

      - name: Create DockerHub manifest list
        if: ${{ inputs.push_dockerhub == true }}
        working-directory: /tmp/digests
        run: |
          IMAGE="${{ needs.prepare.outputs.org_name }}/${{ needs.prepare.outputs.repo_name }}"
          TAGS="-t $IMAGE:${{ github.sha }}"
          [ -n "${{ needs.prepare.outputs.dockerhub_version_tag }}" ] && TAGS="$TAGS -t ${{ needs.prepare.outputs.dockerhub_version_tag }}"
          [ -n "${{ needs.prepare.outputs.dockerhub_latest_tag }}" ] && TAGS="$TAGS -t ${{ needs.prepare.outputs.dockerhub_latest_tag }}"
          docker buildx imagetools create $TAGS $(printf "$IMAGE@sha256:%s " *)

      - name: Generate CVEs with Docker Scout (Docker Hub)
        if: ${{ !github.event.repository.private && inputs.push_dockerhub == true }}
        uses: docker/scout-action@v1
        with:
          command: cves
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          image: registry://${{ needs.prepare.outputs.org_name }}/${{ needs.prepare.outputs.repo_name }}:${{ needs.prepare.outputs.version }}
          organization: ${{ needs.prepare.outputs.org_name }}
          exit-code: false
          sarif-file: scout.sarif
          write-comment: false
      - name: Generate CVEs with Docker Scout (GHCR only)
        if: ${{ !github.event.repository.private && inputs.push_ghcr == true && inputs.push_dockerhub == false }}
        uses: docker/scout-action@v1
        with:
          command: cves
          registry-user: ${{ github.repository_owner }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ghcr.io/${{ needs.prepare.outputs.org_name }}/${{ needs.prepare.outputs.repo_name }}:${{ needs.prepare.outputs.version }}
          organization: ${{ needs.prepare.outputs.org_name }}
          exit-code: false
          sarif-file: scout.sarif
          write-comment: false
      - name: Upload Scout's SARIF results directly to GHAS
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ !github.event.repository.private && (inputs.push_dockerhub == true || inputs.push_ghcr == true) }}
        with:
          category: scout
          sarif_file: scout.sarif
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Isolated container CVE scan (ENG-314). Consumes the amd64 image tarball the
  # build job exported and scans it with a digest-pinned Trivy image. Runs
  # least-privilege (contents: read, no secrets) so a compromised scanner has
  # nothing to steal; results are an uploaded artifact only (no GHAS upload),
  # and the job fails on scan_fail_severity.
  scan-image:
    name: Scan image for CVEs
    needs: build
    if: ${{ inputs.scan_container }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download amd64 image
        uses: actions/download-artifact@v8
        with:
          name: scan-image
          path: ${{ runner.temp }}/scan
      # One comprehensive scan: every severity, fixed and unfixed. The JSON is
      # the report artifact and the full table is printed to the log; the gate
      # below is computed from this same report so we never re-scan.
      - name: Scan image for CVEs
        env:
          TRIVY_IMAGE: ${{ inputs.trivy_image }}
          SCAN_DIR: ${{ runner.temp }}/scan
        run: |
          set -euo pipefail
          docker run --rm -v "${SCAN_DIR}:/scan" "${TRIVY_IMAGE}" image \
            --input /scan/scan-image.tar \
            --scanners vuln \
            --format json \
            --output /scan/trivy-report.json \
            --exit-code 0
          echo "::group::Trivy report (all severities)"
          docker run --rm -v "${SCAN_DIR}:/scan" "${TRIVY_IMAGE}" convert \
            --format table /scan/trivy-report.json || true
          echo "::endgroup::"
      - name: Upload CVE report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: trivy-container-report
          path: ${{ runner.temp }}/scan/trivy-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Fail on gating vulnerabilities
        env:
          FAIL_SEVERITY: ${{ inputs.scan_fail_severity }}
          IGNORE_UNFIXED: ${{ inputs.scan_ignore_unfixed }}
          REPORT: ${{ runner.temp }}/scan/trivy-report.json
        run: |
          set -euo pipefail
          count=$(jq --arg sevs "${FAIL_SEVERITY}" --arg iu "${IGNORE_UNFIXED}" '
            ($sevs | split(",")) as $s
            | [ .Results[]?.Vulnerabilities // [] | .[]
                | select( .Severity as $v | $s | index($v) )
                | select( ($iu != "true") or ((.FixedVersion // "") != "") ) ]
            | length' "${REPORT}")
          echo "Gating vulnerabilities (${FAIL_SEVERITY}, ignore_unfixed=${IGNORE_UNFIXED}): ${count}"
          if [ "${count}" -gt 0 ]; then
            echo "::error::${count} vulnerabilit(y/ies) at ${FAIL_SEVERITY} with a fix available. See the trivy-container-report artifact."
            exit 1
          fi
          echo "No gating vulnerabilities found."
