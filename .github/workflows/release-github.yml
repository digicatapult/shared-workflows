name: Release Github
on:
  workflow_call:
    inputs:
      timeout_minutes:
        description: "Overrides the timeout of every job in this workflow. Leave at 0 to use each job's own default, listed below"
        required: false
        type: number
        default: 0
      env_vars:
        required: false
        type: string
        default: "{}"
      get_sbom:
        required: false
        type: boolean
        default: false
      expected_sbom_count:
        required: false
        type: number
        default: 1
      additional_release_artifact_patterns:
        required: false
        type: string
        default: ""
        description: "Allowlist glob passed directly to actions/download-artifact's `pattern` input (supports extglob brace syntax for multiple artefacts to attach as additional release assets. Leave empty to skip."
      generate_checksums:
        required: false
        type: boolean
        default: true
        description: "Generate a checksums.sha256 manifest of every attached release asset and attach it as a release asset itself, so hashes remain verifiable after source artefacts expire."
jobs:
  release:
    name: "Release"
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes || 15 }}
    steps:
      - uses: actions/checkout@v7
      - name: Set environment variables from JSON
        env:
          ENV_VARS_JSON: "${{ inputs.env_vars }}"
        run: |
          echo "Parsing JSON environment variables..."
          echo "$ENV_VARS_JSON" | jq -r 'to_entries|map("\(.key)=\(.value|tostring)")|.[]' >> $GITHUB_ENV
      - id: get_version
        uses: digicatapult/check-version@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate release notes from PR body
        id: release_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "body<<EOF" >> $GITHUB_OUTPUT

          echo "## Changes" >> $GITHUB_OUTPUT

          PR_NUMBER=$(gh pr list --state merged --base main --limit 1 --json number --jq '.[0].number')
          echo "Fetching body for PR #$PR_NUMBER"

          PR_JSON=$(gh pr view "$PR_NUMBER" --json title,url,body --jq '{title, url, body}')
          PR_TITLE=$(echo "$PR_JSON" | jq -r '.title')
          PR_URL=$(echo "$PR_JSON" | jq -r '.url')
          BODY=$(echo "$PR_JSON" | jq -r '.body')

          echo "**[$PR_TITLE]($PR_URL)**" >> $GITHUB_OUTPUT

          echo "$BODY" | awk '
            BEGIN { section = "" }

            /^## Linked tickets/         { section = "### Linked Tickets"; print "\n" section; next }
            /^## High level description/ { section = "### High Level Description"; print "\n" section; next }
            /^## Detailed description/   { section = "### Detailed Description"; print "\n" section; next }

            /^## / { section = ""; next }

            { if (section != "") print $0 }
          ' >> $GITHUB_OUTPUT

          echo "EOF" >> $GITHUB_OUTPUT
      - name: Download SBOM artefacts
        uses: actions/download-artifact@v8
        if: inputs.get_sbom
        with:
          pattern: '*.cdx.json'
          merge-multiple: true
      - name: Validate SBOM count
        if: inputs.get_sbom
        env:
          EXPECTED_SBOM_COUNT: ${{ inputs.expected_sbom_count }}
        run: |
          sbom_count=$(find . -type f -name '*.cdx.json' -print | wc -l)
          if [ "${sbom_count}" -ne "${EXPECTED_SBOM_COUNT}" ]; then
            echo "Expected ${EXPECTED_SBOM_COUNT} SBOM artefact(s), found ${sbom_count}." >&2
            exit 1
          fi
      - name: Download additional release artefacts
        uses: actions/download-artifact@v8
        if: inputs.additional_release_artifact_patterns != ''
        with:
          pattern: ${{ inputs.additional_release_artifact_patterns }}
          path: additional-release-assets
          merge-multiple: true
      - name: Generate release asset checksums manifest
        id: checksums
        if: |
          inputs.generate_checksums &&
          (inputs.get_sbom || inputs.additional_release_artifact_patterns != '')
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          rm -f checksums.sha256
          for f in **/*.cdx.json additional-release-assets/**/*; do
            [ -f "$f" ] || continue
            sha256sum "$f" >> checksums.sha256
          done
          if [ -s checksums.sha256 ]; then
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            rm -f checksums.sha256
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build release files list
        id: release_files
        run: |
          {
            echo "files<<RELEASE_FILES_EOF"
            if [ "${{ inputs.get_sbom }}" = "true" ]; then
              echo "**/*.cdx.json"
            fi
            if [ "${{ inputs.additional_release_artifact_patterns }}" != "" ]; then
              echo "additional-release-assets/**"
            fi
            if [ "${{ steps.checksums.outputs.generated }}" = "true" ]; then
              echo "checksums.sha256"
            fi
            echo "RELEASE_FILES_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub release version
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          make_latest: true
          body: ${{ steps.release_notes.outputs.body }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: ${{ steps.release_files.outputs.files }}
      - name: Update latest tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch --tags
          git tag -f latest
          git push origin -f latest
      - name: Create GitHub release latest
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Release ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: ${{ steps.release_notes.outputs.body }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: ${{ steps.release_files.outputs.files }}
