name: Release Github
on:
  workflow_call:
    inputs:
      timeout_minutes:
        description: "Overrides the timeout of every job in this workflow. Leave at 0 to use each job's own default, listed below"
        required: false
        type: number
        default: 0
      env_vars:
        required: false
        type: string
        default: "{}"
      get_sbom:
        required: false
        type: boolean
        default: false
        description: "Deprecated: download and attach *.cdx.json artefacts directly. Use stage-release-assets.yml and release_assets_artifact_name instead."
      expected_sbom_count:
        required: false
        type: number
        default: 1
        description: "Deprecated: expected number of SBOM artefacts when get_sbom is enabled."
      release_assets_artifact_name:
        required: false
        type: string
        default: ""
        description: "Name of the bundle artefact uploaded by stage-release-assets.yml. Its files are verified against its checksums.sha256 and attached as release assets, together with the manifest. Leave empty to release without assets."
jobs:
  release:
    name: "Release"
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes || 15 }}
    steps:
      - uses: actions/checkout@v7
      - name: Set environment variables from JSON
        env:
          ENV_VARS_JSON: "${{ inputs.env_vars }}"
        run: |
          echo "Parsing JSON environment variables..."
          echo "$ENV_VARS_JSON" | jq -r 'to_entries|map("\(.key)=\(.value|tostring)")|.[]' >> $GITHUB_ENV
      - id: get_version
        uses: digicatapult/check-version@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate release notes from PR body
        id: release_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "body<<EOF" >> $GITHUB_OUTPUT

          echo "## Changes" >> $GITHUB_OUTPUT

          PR_NUMBER=$(gh pr list --state merged --base main --limit 1 --json number --jq '.[0].number')
          echo "Fetching body for PR #$PR_NUMBER"

          PR_JSON=$(gh pr view "$PR_NUMBER" --json title,url,body --jq '{title, url, body}')
          PR_TITLE=$(echo "$PR_JSON" | jq -r '.title')
          PR_URL=$(echo "$PR_JSON" | jq -r '.url')
          BODY=$(echo "$PR_JSON" | jq -r '.body')

          echo "**[$PR_TITLE]($PR_URL)**" >> $GITHUB_OUTPUT

          echo "$BODY" | awk '
            BEGIN { section = "" }

            /^## Linked tickets/         { section = "### Linked Tickets"; print "\n" section; next }
            /^## High level description/ { section = "### High Level Description"; print "\n" section; next }
            /^## Detailed description/   { section = "### Detailed Description"; print "\n" section; next }

            /^## / { section = ""; next }

            { if (section != "") print $0 }
          ' >> $GITHUB_OUTPUT

          echo "EOF" >> $GITHUB_OUTPUT
      - name: Validate release asset inputs
        env:
          GET_SBOM: ${{ inputs.get_sbom }}
          RELEASE_ASSETS_ARTIFACT_NAME: ${{ inputs.release_assets_artifact_name }}
        run: |
          set -euo pipefail
          if [[ "${GET_SBOM}" == "true" && -n "${RELEASE_ASSETS_ARTIFACT_NAME}" ]]; then
            printf '::error::get_sbom is deprecated and cannot be combined with release_assets_artifact_name. Stage SBOMs with stage-release-assets.yml instead.\n' >&2
            exit 1
          fi
      - name: Download legacy SBOM artefacts
        if: inputs.get_sbom
        uses: actions/download-artifact@v8
        with:
          pattern: '*.cdx.json'
          merge-multiple: true
      - name: Validate legacy SBOM count
        if: inputs.get_sbom
        env:
          EXPECTED_SBOM_COUNT: ${{ inputs.expected_sbom_count }}
        run: |
          set -euo pipefail
          sbom_count=$(find . -type f -name '*.cdx.json' -print | wc -l)
          if [[ "${sbom_count}" -ne "${EXPECTED_SBOM_COUNT}" ]]; then
            printf '::error::Expected %s SBOM artefact(s), found %s.\n' "${EXPECTED_SBOM_COUNT}" "${sbom_count}" >&2
            exit 1
          fi
      - name: Download release assets bundle
        if: inputs.release_assets_artifact_name != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.release_assets_artifact_name }}
          path: release-assets
      # Publishes only what the (attested) manifest lists: every file must
      # match its hash, and no unlisted file may ride along.
      - name: Verify release assets against checksums manifest
        if: inputs.release_assets_artifact_name != ''
        working-directory: release-assets
        env:
          ARTIFACT_NAME: ${{ inputs.release_assets_artifact_name }}
        run: |
          set -euo pipefail
          if [[ ! -s checksums.sha256 ]]; then
            printf '::error::Artefact %s has no non-empty checksums.sha256 at its root; stage it with stage-release-assets.yml.\n' "${ARTIFACT_NAME}" >&2
            exit 1
          fi
          sha256sum --check --strict checksums.sha256
          listed=$(awk '{ sub(/^[^ ]+ [ *]/, ""); print }' checksums.sha256 | sort)
          present=$(find . -type f ! -name checksums.sha256 -printf '%P\n' | sort)
          if [[ "${listed}" != "${present}" ]]; then
            printf '::error::Files in %s do not match checksums.sha256:\n%s\n' "${ARTIFACT_NAME}" "$(diff <(printf '%s\n' "${listed}") <(printf '%s\n' "${present}") || true)" >&2
            exit 1
          fi
      - name: Build release files list
        id: release_files
        env:
          ARTIFACT_NAME: ${{ inputs.release_assets_artifact_name }}
        run: |
          {
            echo "files<<RELEASE_FILES_EOF"
            if [[ "${{ inputs.get_sbom }}" == "true" ]]; then
              echo "**/*.cdx.json"
            fi
            if [[ -n "${ARTIFACT_NAME}" ]]; then
              echo "release-assets/*"
            fi
            echo "RELEASE_FILES_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub release version
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          make_latest: true
          body: ${{ steps.release_notes.outputs.body }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: ${{ steps.release_files.outputs.files }}
      - name: Clear existing latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Deletes the previous `latest` release (and its tag) outright,
          # rather than overwriting only same-named assets, so a file that
          # stops being produced (narrowed pattern, dropped scan, renamed
          # SBOM) can't linger on `latest` next to a checksums.sha256 that no
          # longer lists it.
          release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --jq '.[] | select(.tag_name == "latest") | .id')
          if [[ -n "${release_id}" ]]; then
            gh release delete latest --yes --cleanup-tag
          fi
      - name: Update latest tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch --tags
          git tag -f latest
          git push origin -f latest
      - name: Create GitHub release latest
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Release ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          make_latest: false
          generate_release_notes: true
          body: ${{ steps.release_notes.outputs.body }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: ${{ steps.release_files.outputs.files }}
