name: Release Github
on:
  workflow_call:
    inputs:
      env_vars:
        required: false
        type: string
        default: "{}"
      get_sbom:
        required: false
        type: boolean
        default: false
jobs:
  release:
    name: "Release"
    runs-on: ubuntu-latest
    steps:
      # Full history and tags are needed to work out which commits, and
      # therefore which pull requests, this release actually contains.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set environment variables from JSON
        env:
          ENV_VARS_JSON: "${{ inputs.env_vars }}"
        run: |
          echo "Parsing JSON environment variables..."
          echo "$ENV_VARS_JSON" | jq -r 'to_entries|map("\(.key)=\(.value|tostring)")|.[]' >> $GITHUB_ENV
      - id: get_version
        uses: digicatapult/check-version@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # Release notes are built from every pull request contained in this
      # release, resolved from the commits since the previous release tag.
      #
      # This previously took `gh pr list --state merged --base main --limit 1`,
      # which is wrong in two ways. `gh pr list` orders by *created* date, not
      # merged date, so a long-lived pull request merged today loses to a newer
      # one merged last week. And it only ever credits a single pull request, so
      # any release containing more than one (which is every batched merge queue
      # merge, and any release covering several pushes) silently attributes the
      # whole release to one arbitrary change.
      #
      # Walking the commit range fixes both, and is also what makes this correct
      # under merge queue versioning, where the released commit is a bot version
      # commit with no pull request of its own.
      - name: Generate release notes from merged pull requests
        id: release_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES_PATH: ${{ runner.temp }}/release-notes.md
          MAX_COMMITS: "200"
        run: |
          set -euo pipefail

          # Tags for releases are bare semver (see "Create GitHub release
          # version" below). `latest` is force-moved by this workflow, so it must
          # not be matched here or the range would always be empty.
          prev_tag=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)

          if [[ -n "${prev_tag}" ]]; then
            echo "Previous release tag: ${prev_tag}"
            range="${prev_tag}..HEAD"
          else
            echo "No previous release tag found, describing the head commit only."
            range="HEAD"
            MAX_COMMITS="1"
          fi

          shas=$(git log --format='%H' -n "${MAX_COMMITS}" "${range}" || true)
          total=$(printf '%s\n' "${shas}" | grep -c . || true)
          echo "Commits in range: ${total}"

          pr_numbers=""
          for sha in ${shas}; do
            found=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" \
              --jq '.[].number' 2>/dev/null || true)
            if [[ -n "${found}" ]]; then
              pr_numbers+="${found}"$'\n'
            fi
          done
          pr_numbers=$(printf '%s\n' "${pr_numbers}" | grep -E '^[0-9]+$' | sort -un || true)

          {
            echo "## Changes"
          } > "${NOTES_PATH}"

          if [[ -z "${pr_numbers}" ]]; then
            echo "No pull requests resolved for this range."
            echo "" >> "${NOTES_PATH}"
            echo "_No pull requests were associated with this release._" >> "${NOTES_PATH}"
          else
            echo "Pull requests in this release:" $(printf '#%s ' ${pr_numbers})
            for pr in ${pr_numbers}; do
              PR_JSON=$(gh pr view "${pr}" --json title,url,body --jq '{title, url, body}')
              PR_TITLE=$(jq -r '.title' <<< "${PR_JSON}")
              PR_URL=$(jq -r '.url' <<< "${PR_JSON}")
              BODY=$(jq -r '.body' <<< "${PR_JSON}")

              {
                echo ""
                echo "**[${PR_TITLE}](${PR_URL})**"
              } >> "${NOTES_PATH}"

              awk '
                BEGIN { section = "" }

                /^## Linked tickets/         { section = "### Linked Tickets"; print "\n" section; next }
                /^## High level description/ { section = "### High Level Description"; print "\n" section; next }
                /^## Detailed description/   { section = "### Detailed Description"; print "\n" section; next }

                /^## / { section = ""; next }

                { if (section != "") print $0 }
              ' <<< "${BODY}" >> "${NOTES_PATH}"
            done
          fi

          if [[ "${total}" -ge "${MAX_COMMITS}" && -n "${prev_tag}" ]]; then
            echo "::warning::Release notes considered only the most recent ${MAX_COMMITS} commits since ${prev_tag}. Some pull requests may be missing."
          fi

          echo "notes_path=${NOTES_PATH}" >> "${GITHUB_OUTPUT}"

          echo "::group::Generated release notes"
          cat "${NOTES_PATH}"
          echo "::endgroup::"
      - name: Download SBOM artefacts
        uses: actions/download-artifact@v8
        if: inputs.get_sbom
        with:
          name: ${{ github.event.repository.name }}.cdx.json
      - name: Create GitHub release version
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          make_latest: true
          body_path: ${{ steps.release_notes.outputs.notes_path }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            **/*.cdx.json
      - name: Update latest tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch --tags
          git tag -f latest
          git push origin -f latest
      - name: Create GitHub release latest
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Release ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: ${{ steps.release_notes.outputs.notes_path }}
          token: ${{ secrets.GITHUB_TOKEN }}
