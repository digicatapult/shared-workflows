name: NPM Fallow audit
on:
  workflow_call:
    inputs:
      timeout_minutes:
        description: "Overrides the timeout of every job in this workflow. Leave at 0 to use each job's own default, listed below"
        required: false
        type: number
        default: 0
      node_version:
        required: false
        type: string
        default: 24.x
      install_dependencies:
        description: Run `npm ci` before the audit so module resolution and type-aware analysis can use node_modules.
        required: false
        type: boolean
        default: true
      fallow_version:
        description: Fallow CLI version to install; it is not taken from the caller's package.json.
        required: false
        type: string
        # renovate: datasource=npm depName=fallow
        default: "3.31.0"
      root:
        description: Project root directory to analyse and install dependencies in. Must contain the package-lock.json; use `workspace` to narrow to an npm workspace member.
        required: false
        type: string
        default: "."
      workspace:
        description: Scope findings to one or more npm workspaces (package names, globs or paths, comma-separated). Empty analyses every workspace.
        required: false
        type: string
        default: ""
      config:
        description: Path to the Fallow config file. Empty uses Fallow's auto-discovery.
        required: false
        type: string
        default: ""
      scope:
        description: "'changed' reports findings on lines added by the pull request plus file-level findings; 'all' reports the whole codebase. 'changed' only applies to pull_request events."
        required: false
        type: string
        default: changed
      fail_on:
        description: "'none' never fails (advisory); 'new' runs `fallow audit` and fails only on error-severity findings the pull request introduces; 'any' fails on every finding in scope, regardless of severity."
        required: false
        type: string
        default: none
      analyses:
        description: Comma-separated analyses to run (dead-code, dupes, health). Empty runs all. Not supported with fail_on 'new'.
        required: false
        type: string
        default: ""
      baseline:
        description: Path to a committed Fallow baseline; findings already in it are not reported. Covers dead code only in a combined run, so pair with analyses 'dead-code'. Not supported with fail_on 'new'.
        required: false
        type: string
        default: ""
      comment:
        description: Post a sticky PR comment and Fallow check run.
        required: false
        type: boolean
        default: true
      review_comments:
        description: Post findings as inline PR review comments. Only applies when scope is 'changed'; otherwise findings are emitted as annotations.
        required: false
        type: boolean
        default: true
      annotations:
        description: Emit findings as workflow annotations when inline review comments are not posted.
        required: false
        type: boolean
        default: true
      args:
        description: Additional space-separated arguments passed to the Fallow CLI. Gate flags passed here only warn and never fail the job.
        required: false
        type: string
        default: ""
jobs:
  fallow:
    name: Fallow audit
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes || 15 }}
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Resolve settings
        id: settings
        env:
          SCOPE: ${{ inputs.scope }}
          FAIL_ON: ${{ inputs.fail_on }}
          ANALYSES: ${{ inputs.analyses }}
          BASELINE: ${{ inputs.baseline }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          case "$SCOPE" in changed|all) ;; *) echo "::error::scope must be 'changed' or 'all', got: ${SCOPE}"; exit 1 ;; esac
          case "$FAIL_ON" in none|new|any) ;; *) echo "::error::fail_on must be 'none', 'new' or 'any', got: ${FAIL_ON}"; exit 1 ;; esac
          if [[ "$FAIL_ON" == "new" && "$SCOPE" != "changed" ]]; then
            echo "::error::fail_on 'new' compares against the pull request base and requires scope 'changed'. To gate the whole codebase use fail_on 'any' with a baseline."
            exit 1
          fi
          if [[ "$FAIL_ON" == "new" && ( -n "$ANALYSES" || -n "$BASELINE" ) ]]; then
            echo "::error::analyses and baseline are not supported with fail_on 'new'."
            exit 1
          fi

          if [[ "$SCOPE" == "changed" && "$EVENT_NAME" != "pull_request" && "$EVENT_NAME" != "pull_request_target" ]]; then
            # Without a PR base Fallow analyses the whole codebase, so do not gate on it.
            echo "::notice::scope '${SCOPE}' only applies to pull requests; this ${EVENT_NAME} run reports the whole codebase without failing."
            FAIL_ON=none
          fi

          command=""
          gate=""
          fail_on_issues=false
          case "$FAIL_ON" in
            new) command=audit; gate=new-only; fail_on_issues=true ;;
            any) fail_on_issues=true ;;
          esac
          {
            echo "command=${command}"
            echo "gate=${gate}"
            echo "fail_on_issues=${fail_on_issues}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: ${{ inputs.install_dependencies }}
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.root }}/package-lock.json
      - name: Install Packages
        if: ${{ inputs.install_dependencies }}
        working-directory: ${{ inputs.root }}
        run: npm ci --ignore-scripts
      - name: Audit code
        uses: fallow-rs/fallow@fccff887da0d83db1711379e0a3696dfc2460fdd # v3
        with:
          version: ${{ inputs.fallow_version }}
          command: ${{ steps.settings.outputs.command }}
          gate: ${{ steps.settings.outputs.gate }}
          root: ${{ inputs.root }}
          workspace: ${{ inputs.workspace }}
          config: ${{ inputs.config }}
          only: ${{ inputs.analyses }}
          baseline: ${{ inputs.baseline }}
          auto-changed-since: ${{ inputs.scope == 'changed' }}
          diff-filter: ${{ inputs.scope == 'changed' && 'added' || 'nofilter' }}
          summary-scope: ${{ inputs.scope == 'all' && 'all' || 'diff' }}
          fail-on-issues: ${{ steps.settings.outputs.fail_on_issues }}
          comment: ${{ inputs.comment }}
          # Inline review comments can only target lines in the PR diff.
          review-comments: ${{ inputs.review_comments && inputs.scope == 'changed' }}
          annotations: ${{ inputs.annotations }}
          args: ${{ inputs.args }}
          branded-token: false
