name: Perform secret scans
on:
  workflow_call:
    inputs:
      base:
        required: false
        type: string
        default: ""
        description: An optional branch to base the scan on.
      enable_trufflehog_action:
        required: false
        type: boolean
        default: true
        description: An option to enable the TruffleHog secret scan action.
      env_vars:
        required: false
        type: string
        default: "{}"
        description: Extra variables to be passed to the environment.
      extra_args:
        required: false
        type: string
        default: "--results=verified,unknown --exclude-detectors=Lob"
        description: Extra arguments to be passed to the TruffleHog CLI.
      image:
        required: false
        type: string
        # renovate: datasource=docker depName=ghcr.io/trufflesecurity/trufflehog
        default: "ghcr.io/trufflesecurity/trufflehog:3.96.0"
        description: TruffleHog image (registry/repo:tag) to run; the upstream image defaults to 'latest', which could introduce breaking changes.
jobs:
  trufflehog:
    if: ${{ inputs.enable_trufflehog_action == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set environment variables from JSON
        env:
          ENV_VARS_JSON: "${{ inputs.env_vars }}"
          TRUFFLEHOG_IMAGE_INPUT: ${{ inputs.image }}
        run: |
          echo "Parsing JSON environment variables..."
          echo "$ENV_VARS_JSON" | jq -r 'to_entries|map("\(.key)=\(.value|tostring)")|.[]' >> $GITHUB_ENV
          echo "TRUFFLEHOG_IMAGE=${TRUFFLEHOG_IMAGE_INPUT%:*}" >> "$GITHUB_ENV"
          echo "TRUFFLEHOG_TAG=${TRUFFLEHOG_IMAGE_INPUT##*:}" >> "$GITHUB_ENV"
      - name: TruffleHog PR scan
        uses: trufflesecurity/trufflehog@v3.97.1
        env:
          TRUFFLEHOG_BASE: ${{ inputs.base }}
          TRUFFLEHOG_HEAD: ${{ github.ref_name }}
          TRUFFLEHOG_EXTRA_ARGS: ${{ inputs.extra_args }}
        with:
          base: ${{ env.TRUFFLEHOG_BASE }}
          head: ${{ env.TRUFFLEHOG_HEAD }}
          extra_args: ${{ env.TRUFFLEHOG_EXTRA_ARGS }}
          image: ${{ env.TRUFFLEHOG_IMAGE }}
          version: ${{ env.TRUFFLEHOG_TAG }}
